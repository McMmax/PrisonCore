# Language configuration for PrisonCore
# All messages and command usage strings

commands:
  cell:
    help:
      header: "&6Cell Commands:"
      usage:
        - "&e/cell create <name> &7- Create a new cell"
        - "&e/cell delete &7- Delete your cell"
        - "&e/cell join <name> &7- Join a public cell"
        - "&e/cell leave &7- Leave your current cell"
        - "&e/cell info [name] &7- Show cell information"
        - "&e/cell list &7- List all public cells"
        - "&e/cell invite <player> &7- Invite a player to your cell"
        - "&e/cell kick <player> &7- Kick a player from your cell"
        - "&e/cell revoke <player> &7- Revoke an invitation"
        - "&e/cell invites &7- View pending invitations"
        - "&e/cell desc <description> &7- Set cell description"
        - "&e/cell announce <message> &7- Make an announcement"
        - "&e/cell promote <player> &7- Promote a player to next role"
        - "&e/cell demote <player> &7- Demote a player to previous role"
        - "&e/cell deposit <amount> &7- Deposit money into your cell"

    create:
      success: "&aCell '{name}' has been created successfully!"
      already_in_cell: "&cYou are already in a cell. Leave your current cell first."
      name_taken: "&cA cell with the name '{name}' already exists."
      insufficient_rank: "&cYou need rank {required} or higher to create a cell."
      data_error: "&cFailed to load your player data."
      error: "&cFailed to create cell due to an error."
      invalid_name: "&cCell name must be between 3-16 characters long."
      invalid_characters: "&cCell name can only contain letters, numbers, and underscores."

    delete:
      success: "&aCell '{name}' has been deleted successfully."
      not_in_cell: "&cYou are not in a cell."
      not_found: "&cCell not found."
      not_leader: "&cOnly the cell leader can delete the cell."
      error: "&cFailed to delete cell due to an error."

    join:
      success: "&aYou have joined cell '{name}'!"
      success_invitation: "&aYou have accepted the invitation and joined cell '{name}'!"
      not_found: "&cCell '{name}' not found."
      already_in_cell: "&cYou are already in a cell."
      full: "&cThis cell is full."
      private: "&cThis cell is private and cannot be joined."
      no_invitation: "&cYou don't have an invitation to cell '{name}'."
      error: "&cFailed to join cell due to an error."

    leave:
      success: "&aYou have left your cell."
      not_in_cell: "&cYou are not in a cell."
      not_found: "&cCell not found."
      leader_cannot_leave: "&cAs the leader, you cannot leave the cell. Delete it instead or transfer leadership."
      error: "&cFailed to leave cell due to an error."

    info:
      format:
        - "&6&m                                                            "
        - "&6{name} &7[{online}&7/{count}]{status} &8| &fLvL. {level}"
        - "&6Announcement: &e{announcement}"
        - "&6Leader: {leader}"
        - "&6Co-Leaders: {coleaders}"
        - "&6Captains: {captains}"
        - "&6Members: {members}"
        - "&6Created: &e{date}"
        - "&6Description: &e{description}"
        - "&6Cell Balance: &e${balance}"
        - " {upgrade_info}"
        - "&6&m                                                            "
      not_in_cell: "&cYou are not in a cell. Use '/cell info <name>' to view another cell."
      not_found: "&cCell '{name}' not found."

    list:
      empty: "&cNo cells with online members found."
      header: "&6Online Cells ({count}):"
      entry: "&e- {name} &7(Leader: {leader}, Online: &a{online}&7/{members})"

    invite:
      sent: "&aInvitation sent to {player}!"
      not_in_cell: "&cYou are not in a cell."
      not_leader: "&cOnly the cell leader can invite players."
      player_not_found: "&cPlayer '{player}' not found."
      already_in_cell: "&c{player} is already in a cell."
      cell_full: "&cYour cell is full."
      already_invited: "&c{player} already has a pending invitation."
      cell_not_found: "&cCell not found."
      no_invitation: "&cNo invitation found."
      error: "&cFailed to send invitation."

      # Messages for invitation notifications
      received:
        - "&6&l▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"
        - "&6You have been invited to join cell '&e{cell}&6' by &e{inviter}&6!"
        - "&7Click: &a[JOIN] &7or &c[DECLINE]"
        - "&6&l▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"

      accepted_inviter: "&a{player} has accepted your invitation to join cell '{cell}'!"
      declined_inviter: "&c{player} has declined your invitation to join cell '{cell}'."
      revoked_invitee: "&cYour invitation to join cell '{cell}' has been revoked by {leader}."

    decline:
      success: "&aYou have declined the invitation to cell '{cell}'."
      cell_not_found: "&cCell '{cell}' not found."
      no_invitation: "&cYou don't have an invitation to cell '{cell}'."
      error: "&cFailed to decline invitation."

    revoke:
      success: "&aYou have revoked the invitation to {player}."
      not_in_cell: "&cYou are not in a cell."
      not_leader: "&cOnly the cell leader can revoke invitations."
      player_not_found: "&cPlayer '{player}' not found."
      no_invitation: "&c{player} doesn't have a pending invitation."
      cell_not_found: "&cCell not found."
      error: "&cFailed to revoke invitation."

    invites:
      header: "&6&l▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"
      pending_header: "&6Pending Invitations ({count}):"
      pending_entry: "&e- {cell} &7(from {inviter})"
      no_pending: "&7No pending invitations."
      sent_header: "&6Sent Invitations ({count}):"
      sent_entry: "&e- {player} &7(to {cell})"
      no_sent: "&7No sent invitations."
      footer: "&6&l▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"

    kick:
      success: "&aYou have kicked {player} from your cell."
      not_in_cell: "&cYou are not in a cell."
      not_leader: "&cOnly the cell leader can kick players."
      player_not_found: "&cPlayer '{player}' not found."
      not_member: "&c{player} is not a member of your cell."
      cannot_kick_leader: "&cYou cannot kick the cell leader."
      insufficient_permission: "&cYou don't have permission to kick this player."
      kicked: "&cYou have been kicked from cell '{cell}' by {leader}."
      cell_not_found: "&cCell not found."
      error: "&cFailed to kick player due to an error."

    description:
      success: "&aCell description has been updated successfully!"
      removed: "&aCell description has been removed successfully!"
      not_in_cell: "&cYou are not in a cell."
      not_leader: "&cOnly the cell leader can set the description."
      cell_not_found: "&cCell not found."
      error: "&cFailed to update description due to an error."

    announce:
      success: "&aAnnouncement has been sent to all cell members!"
      removed: "&aCell announcement has been removed successfully!"
      not_in_cell: "&cYou are not in a cell."
      not_leader: "&cOnly the cell leader can make announcements."
      cell_not_found: "&cCell not found."
      error: "&cFailed to send announcement due to an error."
      notification: "&6[&eCell Announcement&6] &e{leader} &6in cell '&e{cell}&6': &f{announcement}"

    role:
      promote_success: "&aYou have promoted {player} to {role}!"
      demote_success: "&aYou have demoted {player} to {role}!"
      not_in_cell: "&cYou are not in a cell."
      no_permission: "&cYou don't have permission to promote or demote players."
      player_not_found: "&cPlayer '{player}' not found."
      not_member: "&c{player} is not a member of your cell."
      invalid_role: "&cInvalid role. Valid roles: {roles}"
      invalid_role_target: "&cCannot change to that role."
      not_promotion: "&cThat would not be a promotion for {player}."
      not_demotion: "&cThat would not be a demotion for {player}."
      insufficient_permission_promote: "&cYou cannot promote to {role} role."
      insufficient_permission_demote: "&cYou don't have permission to demote this player."
      cell_not_found: "&cCell not found."
      error: "&cFailed to change player role due to an error."
      promote_notification: "&aYou have been promoted to {role} in cell '{cell}' by {promoter}!"
      demote_notification: "&cYou have been demoted to {role} in cell '{cell}' by {demoter}."
      already_max_role: "&c{player} is already at the highest role (Co-Leader)."
      already_lowest_role: "&c{player} is already at the lowest role (Member)."
      cannot_promote_leader: "&cYou cannot promote the cell leader."
      cannot_demote_leader: "&cYou cannot demote the cell leader."

    upgrade:
      success: "&aCell upgraded to level {level}!"
      not_in_cell: "&cYou are not in a cell."
      not_leader: "&cOnly the cell leader can upgrade the cell."
      insufficient_permission: "&cYou don't have permission to upgrade the cell. Only Co-Leaders and Leaders can upgrade."
      insufficient_balance: "&cInsufficient cell balance. Required: ${required}, Current: ${current}, Needed: ${needed}"
      insufficient_balance_generic: "&cYour cell doesn't have enough balance to upgrade."
      max_level: "&cYour cell is already at the maximum level."
      cell_not_found: "&cCell not found."
      error: "&cFailed to upgrade cell due to an error."
      success_notification: "&aCell '{cell}' has been upgraded to level {level} by {upgrader}!"

    balance:
      not_in_cell: "&cYou are not in a cell."
      not_leader: "&cOnly the cell leader can add balance to the cell."
      invalid_amount: "&cInvalid amount. Please enter a valid number or use notation like 1K, 1M, 1B."
      positive_only: "&cAmount must be positive."
      added: "&aAdded ${amount} balance to your cell! New total: ${total}"
      error: "&cFailed to add balance to cell due to an error."

    deposit:
      not_in_cell: "&cYou are not in a cell."
      invalid_amount: "&cInvalid amount. Please enter a valid number or use notation like 1K, 1M, 1B."
      positive_only: "&cAmount must be positive."
      insufficient_balance: "&cInsufficient balance. Required: ${required}, Current: ${current}"
      data_error: "&cFailed to load your player data."
      balance_error: "&cFailed to update your balance."
      cell_error: "&cFailed to update cell balance."
      success: "&aDeposited ${amount} into your cell! Cell balance: ${cell_balance}, Remaining balance: ${remaining_balance}"
      notification: "&e{player} &adeposited &e${amount} &ainto cell &e{cell}&a!"

  world:
    help:
      header: "&6World Commands:"
      usage:
        - "&e/world create <name> &7- Create a new world"
        - "&e/world delete <name> &7- Delete an existing world"
        - "&e/world setspawn <name> &7- Set spawn point of a world to your location"
        - "&e/world tp <name> &7- Teleport to a world"
        - "&e/world list &7- List all available worlds"
        - "&e/world info [name] &7- Show information about a world"

    create:
      invalid_name: "&cInvalid world name. Use only letters, numbers, and underscores."
      already_exists: "&cA world with that name already exists."
      success: "&aWorld '{name}' has been created successfully."
      failed: "&cFailed to create world: {error}"

    delete:
      cannot_delete_spawn: "&cYou cannot delete the spawn world."
      not_exists: "&cWorld '{name}' does not exist."
      success: "&aWorld '{name}' has been deleted."
      failed: "&cFailed to delete world: {error}"

    setspawn:
      unknown_world: "&cCould not determine the world you're in."
      success: "&aSpawn point for world '{name}' has been set to your location."
      failed: "&cFailed to set spawn point: {error}"

    info:
      not_exists: "&cWorld '{name}' does not exist."
      unknown_world: "&cCould not determine the world you're in."
      failed_load: "&cFailed to load world '{name}'."
      failed: "&cFailed to get world info: {error}"
      header: "&6&m---------------------&6[ &eWorld Info &6]&m---------------------"
      name: "&6World Name: &e{name}"
      spawn: "&6Spawn Location: &ex: {x}, y: {y}, z: {z}"
      filepath: "&6Polar File: &e{filepath}"
      chunks: "&6Chunk Count: &e{count}"
      players: "&6Players: &e{count}"
      footer: "&6&m------------------------------------------------------"

    tp:
      not_exists: "&cWorld '{name}' does not exist."
      success: "&aTeleported to world '{name}'."
      failed: "&cFailed to teleport: {error}"

    list:
      empty: "&cNo worlds found."
      header: "&6Available worlds ({count}):"
      entry: "&e- {name}"

  teleport:
    help:
      header: "&6Teleport Commands:"
      usage:
        - "&e/teleport <target> &7- Teleport to a player"
        - "&e/tp <target> &7- Teleport to a player (alias)"
        - "&e/tphere <target> &7- Teleport a player to you"
        - "&e/teleport <target> <player> &7- Teleport a player to another player"
        - "&e/tp <target> <player> &7- Teleport a player to another player (alias)"

    success: "&aYou have teleported to &e{target}&a."
    success_here: "&aYou teleported &e{target}&a to your location."
    success_other: "&aYou teleported &e{target}&a to &e{destination}&a."
    teleported_to_you: "&aYou have been teleported to &e{player}&a."
    teleported_by: "&aYou have been teleported by &e{player}&a."

  warps:
    help:
      header: "&6Warp Commands:"
      usage:
        - "&e/spawn &7- Teleport to spawn"
        - "&e/warp <name> &7- Teleport to a warp"
        - "&e/setwarp <name> &7- Set a warp at your location"
        - "&e/delwarp <name> &7- Delete a warp"
        - "&e/warps &7- List all available warps"

    spawn:
      success: "&aYou have been teleported to spawn."
      failed: "&cFailed to teleport to spawn: {error}"

    warp:
      not_exists: "&cWarp '{name}' does not exist."
      success: "&aYou have been teleported to warp '{name}'."
      failed: "&cFailed to teleport to warp '{name}': {error}"

    setwarp:
      success: "&aWarp '{name}' has been set at your location."
      already_exists: "&cWarp '{name}' already exists."
      failed: "&cFailed to set warp '{name}': {error}"

    delwarp:
      not_exists: "&cWarp '{name}' does not exist."
      success: "&aWarp '{name}' has been deleted."
      failed: "&cFailed to delete warp '{name}': {error}"

    list:
      empty: "&cNo warps found."
      header: "&6Available warps ({count}):"
      entry: "&e- {name}"

  region:
    help:
      header: "&6Region Commands:"
      usage:
        - "&e/region create <name> [radius] &7- Create a new region"
        - "&e/region flag <name> <flag> &7- Add or remove a flag from a region"
        - "&e/region info [name] &7- Show information about a region"
        - "&e/region delete <name> &7- Delete a region"
        - "&e/region list &7- List all regions"

    create:
      success: "&aRegion '{name}' created successfully with radius {radius}."
      already_exists: "&cRegion '{name}' already exists."
      failed: "&cFailed to create region: {error}"

    flag:
      success: "&aFlag '{flag}' {action} for region '{name}'."
      not_exists: "&cRegion '{name}' does not exist."
      invalid_flag: "&cInvalid flag '{flag}'."
      failed: "&cFailed to modify flag: {error}"

    info:
      not_exists: "&cRegion '{name}' does not exist."
      header: "&6&m---------------------&6[ &eRegion Info &6]&m---------------------"
      name: "&6Region Name: &e{name}"
      center: "&6Center: &ex: {x}, y: {y}, z: {z}"
      radius: "&6Radius: &e{radius}"
      flags: "&6Flags: &e{flags}"
      footer: "&6&m------------------------------------------------------"

    delete:
      success: "&aRegion '{name}' deleted successfully."
      not_exists: "&cRegion '{name}' does not exist."
      failed: "&cFailed to delete region: {error}"

    list:
      empty: "&cNo regions found."
      header: "&6Regions in this world ({count}):"
      entry: "&e- {name}"

    protection:
      cannot_break: "&cYou cannot break blocks in this region."
      cannot_place: "&cYou cannot place blocks in this region."

  gamemode:
    usage: "&eUsage: /gamemode <mode>"
    help:
      header: "&6Gamemode Commands:"
      usage:
        - "&e/gamemode <mode> &7- Change your gamemode"
        - "&e/gmc &7- Switch to creative mode"
        - "&e/gms &7- Switch to survival mode"

    success: "&aYour current game mode is &e{mode}&a."
    success_other: "&aChanged {player}'s game mode to &e{mode}&a."

  clear:
    help:
      header: "&6Clear Commands:"
      usage:
        - "&e/clear &7- Clear your inventory"
        - "&e/clear <player> &7- Clear another player's inventory"

    success: "&aYour inventory has been cleared."
    success_other: "&a{player}'s inventory has been cleared."
    success_notify: "&aYour inventory has been cleared by &e{player}&a."

  economy:
    help:
      header: "&6Economy Commands:"
      usage:
        - "&e/eco <player> add <amount> &7- Add money to a player (admin)"
        - "&e/eco <player> take <amount> &7- Take money from a player (admin)"
        - "&e/eco <player> set <amount> &7- Set a player's balance (admin)"

    add:
      success: "&aAdded &f{amount} &ato {target}'s balance."
      notify: "&aYour balance was increased by &f{amount}&a."

    take:
      success: "&aTook &f{amount} &afrom {target}."
      notify: "&c{amount} was taken from your balance."

    set:
      success: "&aSet {target}'s balance to &f{amount}&a."
      notify: "&aYour balance has been set to &f{amount}&a."

    invalid_amount: "&cInvalid amount: {amount}"
    positive_only: "&cAmount must be positive."
    non_negative: "&cAmount cannot be negative."

  balance:
    own: "&eBalance: &a${amount}"
    other: "&e{player}'s Balance: &a${amount}"
    not_found: "&cPlayer not found or has no balance."

  tokens:
    help:
      header: "&6Token Commands:"
      usage:
        - "&e/tokens balance [player] &7- Check yours or another player's souls balance"
        - "&e/tokens pay <player> &7- Give souls to another player"

    pay-usage: "&eUsage: /tokens pay <player> <amount>"
    own: "&eTokens: &a{amount}"
    other: "&e{player}'s Tokens: &a{amount}"
    not_found: "&cPlayer not found or has no tokens."

  souls:
    help:
      header: "&6Soul Commands:"
      usage:
        - "&e/souls balance [player] &7- Check yours or another player's souls balance"
        - "&e/souls pay <player> &7- Give souls to another player"
    pay-usage: "&eUsage: /souls pay <player> <amount>"

    own: "&eSouls: &a{amount}"
    other: "&e{player}'s Souls: &a{amount}"
    not_found: "&cPlayer not found or has no souls."

  pay:
    usage: "&eUsage: /pay <player> <amount>"
    help:
      header: "&6Pay Commands:"
      usage:
        - "&e/pay <player> <amount> &7- Send money to another player"

    success: "&aYou sent &f{amount} &ato &e{player}&a."
    received: "&aYou received &f{amount} &afrom &e{sender}&a."
    insufficient: "&cYou don't have enough balance to transfer {amount}."
    invalid_amount: "&cInvalid amount: {amount}"
    positive_only: "&cAmount must be greater than 0."
    not_found: "&cPlayer '{player}' not found or hasn't played before."
    self_pay: "&cYou cannot pay yourself."
    data_error: "&cFailed to retrieve your player data."

  withdraw:
    usage: "&eUsage: /withdraw <amount>"

    success: "&aSuccessfully withdrew &f${amount}&a."
    insufficient: "&cYou don't have enough money. Your balance: &f${balance}&c."
    inventory_full: "&cYour inventory is full!"
    invalid_amount: "&cInvalid amount format. Example formats: 1000, 1K, 1.5M"
    positive_only: "&cPlease enter a positive amount to withdraw."
    data_error: "&cFailed to retrieve your player data."
    error: "&cAn error occurred while processing your withdrawal."

  mine:
    help:
      header: "&6Mine Commands:"
      usage:
        - "&e/mine go &7- Teleport to your mine"
        - "&e/mine go <player> &7- Teleport to another player's mine"

    success: "&aTeleported to your mine!"
    success_other: "&aTeleported to &e{player}&a's mine!"
    no_instance: "&c{player} does not have a mine instance."

  mines:
    help:
      header: "&6Mine Management Commands:"
      usage:
        - "&e/mines create &7- Create a mine in current world"
        - "&e/mines setblocks &7- Set mine blocks from your hotbar"
        - "&e/mines reset &7- Reset the mine"
        - "&e/mines delete &7- Delete the mine"
        - "&e/mines interval <duration> &7- Set mine reset interval"
        - "&e/mines info &7- Show mine information"

    create:
      success: "&aMine creation started successfully!"
      failed: "&cFailed to start mine creation. A mine may already exist in this world."

    setblocks:
      success: "&aMine blocks updated with blocks from your hotbar!"
      usage_info: "&eUse /mines info to see the list of blocks in your mine."
      no_mine: "&cNo mine found in this world. Create one first with /mines create"
      no_blocks: "&cYou need to have at least one valid block in your hotbar to set mine blocks."
      failed: "&cFailed to update mine blocks."

    reset:
      success: "&aMine reset successfully!"
      failed: "&cNo mine found in this world or failed to reset."

    delete:
      success: "&aMine deleted successfully!"
      failed: "&cNo mine found in this world."

    interval:
      success: "&aMine reset interval set to {duration}."
      invalid: "&cInvalid interval! Use formats like 30s, 15m, 2h, etc."
      failed: "&cNo mine found in this world."

    info:
      no_mine: "&cNo mine found in this world."
      header: "&6==== Mine Info ===="
      name: "&eName: &f{name}"
      last_reset: "&eLast reset ({interval}): &f{time} seconds ago"
      blocks_header: "&eBlocks used:"
      block_entry: "&f  - {block}"
      no_blocks: "&f  - None (using STONE as default)"
      instructions: "&bTo change the blocks, place them in your hotbar and use /mines setblocks"

  pickaxe:
    levelup:
      chat: "&6&l✦ &eCongratulations! &6Your pickaxe has reached level &f{level}&6!"
      title: "&6&lLEVEL UP!"
      subtitle: "&eYour pickaxe is now level &f{level}"
      sound: "minecraft:entity.player.levelup"

    enchants:
      activate: " &d&l❂ &5{enchant} &fenchant has destroyed &7{blocks} &fblocks!"
      added: "&a&l✓ &7Added &d{enchant} &7level &f{level} &7to your pickaxe for &e{amount} &6{currency}&7!"
      upgraded: "&a&l✓ &7Upgraded &d{enchant} &7to level &f{level} &7for &e{amount} &6{currency}&7!"
      max_level: "&c&l✗ &7This enchant is already at maximum level!"
      insufficient_funds: "&c&l✗ &7You don't have enough {currency}! Required: &e{amount}"
